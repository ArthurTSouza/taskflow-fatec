name: TaskFlow API - CI CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-build-deploy:
    name: Typecheck, build Docker and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: TypeScript typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Compile backend
        working-directory: backend
        run: npm run build

      - name: Build production Docker image
        run: docker build -t taskflow-api:${{ github.sha }} .

      - name: Trigger Render Deploy Hook
        if: success()
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Secret RENDER_DEPLOY_HOOK_URL não configurado."
            exit 1
          fi
          HTTP_STATUS=$(curl --silent --show-error --output /tmp/render-response.txt \
            --write-out "%{http_code}" \
            --request POST "$RENDER_DEPLOY_HOOK_URL")
          cat /tmp/render-response.txt
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "Deploy Hook falhou. HTTP: $HTTP_STATUS"
            exit 1
          fi
          echo "Deploy Hook aceito. HTTP: $HTTP_STATUS"
